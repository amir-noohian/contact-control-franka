# Complete configuration for cartesian_iac1_tracking_control.

robot_host 172.16.0.2
ignore_realtime 1

# Preset pose in rad, pose tolerance in rad, and t/h move timing.
contact_q_1 -0.00867736
contact_q_2 0.0121568
contact_q_3 0.0219018
contact_q_4 -2.1222
contact_q_5 -0.036766
contact_q_6 2.18263
contact_q_7 0.844116

# Alternate preset pose in rad.
# contact_q_1 -0.0133254
# contact_q_2 -0.052112
# contact_q_3 0.0221932
# contact_q_4 -2.37829
# contact_q_5 -0.0505526
# contact_q_6 2.7637
# contact_q_7 0.85388

pose_tolerance_rad 0.02
joint_move_peak_rad_s 0.15
joint_move_min_s 1.0
joint_move_settle_s 0.25

# PD hold gains for the five held joints.
hold_kp_1 600
hold_kp_3 600
hold_kp_5 250
hold_kp_6 150
hold_kp_7 50
hold_kd_1 50
hold_kd_3 50
hold_kd_5 30
hold_kd_6 25
hold_kd_7 15

# Active joint operating position bounds and displacement from the c pose.
joint_2_min_rad -1.8061
joint_2_max_rad 1.8061
joint_4_min_rad -3.0470
joint_4_max_rad -0.1469
active_excursion_rad 0.30
held_excursion_rad 0.08

# Limits on the outgoing torque command, before Franka's compensation.
torque_limit_1_Nm 12
torque_limit_2_Nm 12
torque_limit_3_Nm 12
torque_limit_4_Nm 12
torque_limit_5_Nm 5
torque_limit_6_Nm 5
torque_limit_7_Nm 5
torque_rate_Nm_s 100

# Force request, command, feedback and contact limits.
min_target_N 0.5
max_target_N 10
max_force_command_N 10
max_measured_force_N 12
contact_threshold_N 0.5
contact_confirmation_s 0.03
contact_timeout_s 4
no_contact_travel_m 0.01
force_ramp_s 2

# Workspace and z-axis authority limits.
max_tool_travel_m 0.02
max_z_speed_m_s 0.03
min_z_jacobian_norm_m_rad 0.05

# Nominal tangent angle and initial effective normal parameter, in radians.
nominal_angle_rad 0.0
# Start adaptation at zero degrees in the base-frame x/z plane.
initial_effective_angle_rad 0.0
# Runtime guard about the nominal angle, not a certified convergence sector.
max_angle_offset_rad 0.4363323130
adaptation_gamma 0.05

# Isotropic position regulation and model directional derivative.
motion_kp 100
motion_kv 10
max_motion_acceleration_m_s2 6.0
model_difference_step_s 0.0001
min_xz_singular_value_m_rad 0.05
max_x_speed_m_s 0.02
max_target_offset_m 0.10
max_task_wrench_N 12
contact_loss_N 0.25
trajectory_duration_s 40
# Total time from contact, including hold at the trajectory endpoint.
run_duration_s 40

# IAC1E2 direct proportional feedback on scalar compression.
force_kp 0.2
